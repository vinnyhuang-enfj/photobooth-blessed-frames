name: Run Photobooth E2E Tests

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 簽出測試程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 建立報告與截圖目錄
        run: mkdir -p playwright-report/screenshots

      - name: 安裝 Playwright 核心模組
        run: npm install -D @playwright/test

      - name: 安裝 Chromium 瀏覽器及其系統依賴
        run: npx playwright install --with-deps chromium

      - name: 執行自動化測試並錄製操作過程
        continue-on-error: true
        run: |
          npx playwright test tests/photobooth.spec.ts --reporter=html --trace=on

      - name: 上傳測試成果與影片報告 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-test-report
          path: playwright-report/
          retention-days: 7
