name: Run k6 Stress Test (1500 VUs)

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

jobs:
  k6_stress_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 簽出專案
        uses: actions/checkout@v4

      - name: 安裝官方 Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: 建立 1500 人階梯加壓腳本
        run: |
          cat << 'EOF' > load-test-1500.js
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { htmlReport } from "https://raw.githubusercontent.com/benc-uk/k6-reporter/main/dist/bundle.js";
          import { textSummary } from "https://jslib.k6.io/k6-summary/0.0.1/index.js";

          export const options = {
            stages: [
              { duration: '30s', target: 200 },   // 階段 1：30 秒內暖身至 200 人
              { duration: '1m',  target: 800 },   // 階段 2：1 分鐘內拉升至 800 人
              { duration: '1m30s', target: 1500 }, // 階段 3：極限衝刺！維持 1,500 人尖峰大合影
              { duration: '1m',  target: 300 },   // 階段 4：緩步降載至 300 人
              { duration: '30s', target: 0 },     // 階段 5：活動結束冷卻
            ],
            thresholds: {
              http_req_failed: ['rate<0.02'],     // 總失敗率控制在 2% 以內
              http_req_duration: ['p(95)<3000'],  // 95% 請求在 3 秒內完成
            },
          };

          const TARGET_URL = 'https://blia2026.vercel.app/';

          export default function () {
            // 請求新網址
            const res = http.get(TARGET_URL);
            check(res, {
              '首頁連線正常 200 OK': (r) => r.status === 200,
            });

            // 模擬真實使用者思考與拍照間隔 1~2 秒
            sleep(Math.random() * 1.5 + 1);
          }

          export function handleSummary(data) {
            return {
              "k6-1500-report.html": htmlReport(data),
              stdout: textSummary(data, { indent: " ", enableColors: true }),
            };
          }
          EOF

      - name: 執行 1500 人高壓測試
        run: k6 run load-test-1500.js

      - name: 上傳 1500 人壓測報告 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-1500-stress-report
          path: k6-1500-report.html
          retention-days: 14
