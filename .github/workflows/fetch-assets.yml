name: Auto Fetch Lovable Assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  download_assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 簽出專案
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下載 Lovable 活動主圖
        run: |
          mkdir -p public/__l5e/assets-v1/c514f3e6-5b3c-4429-9676-78c97005b5bf/
          curl -sL "https://photobooth-blessed-frames.lovable.app/__l5e/assets-v1/c514f3e6-5b3c-4429-9676-78c97005b5bf/event.jpg" \
            -o "public/__l5e/assets-v1/c514f3e6-5b3c-4429-9676-78c97005b5bf/event.jpg"
          echo "Assets fetched" > public/__l5e/status.txt

      - name: 自動提交圖檔至 main 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "feat: download and host lovable assets locally" || exit 0
          git push origin main
